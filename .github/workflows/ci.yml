name: PR checks and release

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  # 仅在手动合并后使用 main 的受信工作流，检查 Job 不持有写权限。
  pull_request_target:
    branches: [main]
    types: [closed]

permissions:
  contents: read

concurrency:
  group: skillscli-${{ github.event_name }}-${{ github.event.pull_request.number }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  checks:
    # 保留 main 的必需检查名称。
    name: Version, tests and build
    if: github.event_name == 'pull_request' || github.event.pull_request.merged == true
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ github.event.pull_request.head.sha }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # PR 测试合并结果；发布只构建已经进入 main 历史的标签提交。
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate VERSION and PR head tag
        id: version
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          MERGED: ${{ github.event_name == 'pull_request_target' }}
        run: |
          TAG=$(< VERSION)
          if [[ ! $TAG =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo '::error::VERSION must contain vX.Y.Z[-prerelease], without leading zeros or build metadata.'
            exit 1
          fi
          printf '%s\n' "$TAG" | cmp -s VERSION -
          git show "$HEAD_SHA:VERSION" | cmp -s VERSION -
          prerelease=false
          if [[ $TAG == *-* ]]; then
            prerelease=true
            IFS=. read -ra identifiers <<< "${TAG#*-}"
            for identifier in "${identifiers[@]}"; do
              if [[ $identifier =~ ^0[0-9]+$ ]]; then
                echo '::error::Numeric prerelease identifiers cannot have leading zeros.'
                exit 1
              fi
            done
          fi
          if [[ $TAG == v0.1.0 ]]; then
            echo '::error::v0.1.0 was retracted and must never be reused.'
            exit 1
          fi
          if [[ $(git rev-parse "refs/tags/$TAG^{commit}") != "$HEAD_SHA" ]]; then
            echo '::error::The existing VERSION tag must point to the final PR head commit.'
            exit 1
          fi
          if [[ $MERGED == true ]]; then
            # Squash/Rebase 若丢失原始 head 则拒绝发布；不能重打标签绕过。
            test "$(git rev-parse HEAD)" = "$HEAD_SHA"
            git merge-base --is-ancestor "$HEAD_SHA" "$MERGE_SHA"
            git merge-base --is-ancestor "$MERGE_SHA" origin/main
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "## Version: $TAG ($HEAD_SHA, prerelease=$prerelease)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: stable
          cache: false
      - name: Format, unit tests, race and vet
        run: |
          test -z "$(gofmt -l main.go main_test.go internal)"
          go test -count=1 ./...
          go test -race -count=1 ./...
          go vet ./...
      - name: Build five binaries and checksums
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          mkdir -p dist/release
          for target in darwin/arm64 windows/amd64 windows/arm64 linux/amd64 linux/arm64; do
            os=${target%/*}
            arch=${target#*/}
            binary="dist/release/skillscli_${os}_${arch}"
            if [[ $os == windows ]]; then binary+=.exe; fi
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -o "$binary" .
            test -s "$binary"
            metadata=$(go version -m "$binary")
            [[ $metadata == *"GOOS=$os"* && $metadata == *"GOARCH=$arch"* && $metadata == *'CGO_ENABLED=0'* ]]
          done
          test "$(./dist/release/skillscli_linux_amd64 -v)" = "$TAG"
          test "$(./dist/release/skillscli_linux_amd64 --version)" = "$TAG"
          cd dist/release
          sha256sum skillscli_* > checksums.txt
          test "$(wc -l < checksums.txt)" -eq 5
          sha256sum -c checksums.txt
      - name: Keep tag-commit release assets
        if: github.event_name == 'pull_request_target'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-binaries
          path: dist/release/
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish tagged version
    needs: checks
    if: github.event_name == 'pull_request_target' && github.event.pull_request.merged == true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-binaries
          path: dist/release
      - name: Publish complete Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.checks.outputs.tag }}
          TAG_SHA: ${{ needs.checks.outputs.sha }}
          PRERELEASE: ${{ needs.checks.outputs.prerelease }}
        run: |
          (cd dist/release && test "$(wc -l < checksums.txt)" -eq 5 && sha256sum -c checksums.txt)
          # 验证普通标签或直接指向 commit 的 annotated tag；不执行标签源码。
          verify_tag() {
            local ref type remote_sha
            ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '[.object.type, .object.sha] | @tsv')
            read -r type remote_sha <<< "$ref"
            if [[ $type == tag ]]; then
              remote_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$remote_sha" --jq 'select(.object.type == "commit") | .object.sha')
            else
              test "$type" = commit
            fi
            test "$remote_sha" = "$TAG_SHA"
          }
          verify_tag
          # 唯一一次占用查询，用写权限令牌覆盖公开 Release 和草稿。
          releases=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq ".[] | select(.tag_name == \"$TAG\") | .tag_name")
          if [[ -n $releases ]]; then
            echo "::error::Release $TAG already exists; refusing to overwrite it."
            exit 1
          fi
          gh release create "$TAG" \
            dist/release/skillscli_darwin_arm64 \
            dist/release/skillscli_windows_amd64.exe \
            dist/release/skillscli_windows_arm64.exe \
            dist/release/skillscli_linux_amd64 \
            dist/release/skillscli_linux_arm64 \
            dist/release/checksums.txt \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$TAG" --generate-notes --prerelease="$PRERELEASE" --draft
          # 不仅计数：附件名称、数量和大小都必须与本地六个文件匹配。
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[] | [.name, .size] | @tsv' | sort > remote-assets.txt
          for asset in dist/release/*; do
            printf '%s\t%s\n' "${asset##*/}" "$(stat -c %s "$asset")"
          done | sort > local-assets.txt
          cmp local-assets.txt remote-assets.txt
          verify_tag
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          echo "## 已发布 $TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
